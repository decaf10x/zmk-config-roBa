on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: xiao_ble//zmk
            shield: roBa_R
            snippet: studio-rpc-usb-uart
            cmake-args: -DCONFIG_ZMK_NEMU_LINK_PERIPHERAL_ID=1
            artifact-name: roBa_R-xiao_ble-zmk
          - board: xiao_ble//zmk
            shield: roBa_L
            cmake-args: -DCONFIG_ZMK_NEMU_LINK_PERIPHERAL_ID=0
            artifact-name: roBa_L-xiao_ble-zmk
          - board: nemu-link-dongle
            snippet: studio-rpc-usb-uart
            artifact-name: nemu-link-dongle-zmk
          - board: xiao_ble//zmk
            shield: settings_reset
            artifact-name: settings_reset-xiao_ble-zmk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: West Init & Update
        run: |
          west init -l config
          west update

      - name: West Zephyr Export
        run: west zephyr-export

      - name: West Build
        run: |
          SHIELD_ARG=""
          if [ -n "${{ matrix.shield }}" ]; then
            SHIELD_ARG="-DSHIELD=${{ matrix.shield }}"
          fi
          SNIPPET_ARG=""
          if [ -n "${{ matrix.snippet }}" ]; then
            SNIPPET_ARG="-S ${{ matrix.snippet }}"
          fi
          west build -s zmk/app -b "${{ matrix.board }}" $SNIPPET_ARG -- -DZMK_CONFIG="$(pwd)/config" $SHIELD_ARG -DZMK_EXTRA_MODULES="$(pwd)" ${{ matrix.cmake-args }}

      - name: Rename Artifact
        run: |
          mkdir -p artifacts
          cp build/zephyr/zmk.uf2 "artifacts/${{ matrix.artifact-name }}.uf2"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/${{ matrix.artifact-name }}.uf2
